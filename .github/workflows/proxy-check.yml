name: Proxy IP Checker

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:       # 支持手动触发

jobs:
  check-proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 30    # 增加超时时间
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # 移除 cache 参数，因为项目中没有 package-lock.json
        # cache: 'npm'   # 注释掉这行
        
    - name: Preprocess IP list
      run: |
        cd scripts
        node preprocess.js
        
    - name: Run proxy checker
      run: |
        cd scripts
        node check-proxy.js
        
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: valid-proxies
        path: valid-proxies.txt
